name: Scheduled Python Script

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at 00:00 UTC
  workflow_dispatch:      # Allows manual triggers from the [Actions tab](https://docs.github.com/actions/managing-workflow-runs/manually-running-a-workflow)

jobs:
  run-script:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Set up uv
      uses: astral-sh/setup-uv@v5

    - name: Install dependencies
      run: |
        uv sync --all-extras --dev

    - name: Run Script    
      run: |
        python -m nba_project.scripts.pipeline_runner
